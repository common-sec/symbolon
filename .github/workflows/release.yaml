name: Release

# One version tag (v*) releases everything, after one approval of the `release` environment:
#
# - the web binding, in the release named after the tag, with its SHA-256;
# - the prebuilt Flutter libraries, in the release precompiled-v<version>_<crate hash>, which is where
#   cargokit looks (flutter/rust/cargokit.yaml). Every file is signed with CARGOKIT_PRIVATE_KEY, a
#   secret of the release environment; apps check the signature and build from source when a library
#   is missing or fails the check.
#
# The tag must match the version in flutter/pubspec.yaml and the Cargo.toml files, so release by
# bumping the version on main and then pushing the tag.
#
# Published releases are immutable in this repository, so files can only be added to a draft. The
# prepare job creates both drafts, the build jobs upload to them, and publish makes them public once
# every file is there. A published release can never be fixed, only replaced by a new version.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      libraries: ${{ steps.drafts.outputs.libraries }}
      build-libraries: ${{ steps.drafts.outputs.build-libraries }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Check the tag matches the version
      run: |
        version=$(sed -n 's/^version: //p' flutter/pubspec.yaml)
        if [ "$GITHUB_REF_NAME" != "v$version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME, but flutter/pubspec.yaml says $version. Bump the version first."
          exit 1
        fi
        for f in Cargo.toml flutter/rust/Cargo.toml wasm/Cargo.toml; do
          grep -qx "version = \"$version\"" "$f" || { echo "::error::$f is not at version $version"; exit 1; }
        done

    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: '3.47.7'
        channel: 'stable'
        cache: true

    - name: Create the draft releases
      id: drafts
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Prints whether the release for tag $1 is a draft: true, false, or nothing if there is none.
        draft() {
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$1\") | .draft"
        }
        case "$(draft "$GITHUB_REF_NAME")" in
          false) echo "::error::$GITHUB_REF_NAME is already published."; exit 1 ;;
          true) echo "Reusing the draft $GITHUB_REF_NAME." ;;
          *) gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
               --title "$GITHUB_REF_NAME" --generate-notes ;;
        esac

        if [ ! -f flutter/rust/cargokit.yaml ]; then
          echo "::notice::No signing key yet (tool/new_signing_key.sh), so no prebuilt libraries."
          echo "build-libraries=false" >>"$GITHUB_OUTPUT"
          exit 0
        fi
        tag=$(cd flutter/cargokit/build_tool && dart pub get >/dev/null && \
          dart run build_tool precompiled-tag --manifest-dir=../../rust)
        echo "libraries=$tag" >>"$GITHUB_OUTPUT"
        case "$(draft "$tag")" in
          false) echo "::notice::$tag is already published."; echo "build-libraries=false" >>"$GITHUB_OUTPUT" ;;
          true) echo "Reusing the draft $tag."; echo "build-libraries=true" >>"$GITHUB_OUTPUT" ;;
          *) gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
               --title "Flutter libraries for $GITHUB_REF_NAME" \
               --notes "Signed prebuilt libraries of symbolon_flutter $GITHUB_REF_NAME, crate hash ${tag##*_}."
             echo "build-libraries=true" >>"$GITHUB_OUTPUT" ;;
        esac

  flutter-libraries:
    name: Flutter libraries (${{ matrix.os }})
    needs: prepare
    if: needs.prepare.outputs.build-libraries == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # The signing key is a secret of this environment, which waits for approval.
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: >-
              --target=x86_64-unknown-linux-gnu
              --target=aarch64-linux-android --target=armv7-linux-androideabi --target=x86_64-linux-android
          - os: macos-latest
            targets: >-
              --target=aarch64-apple-darwin --target=x86_64-apple-darwin
              --target=aarch64-apple-ios --target=aarch64-apple-ios-sim --target=x86_64-apple-ios
          - os: windows-latest
            targets: --target=x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
        working-directory: flutter/cargokit/build_tool
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Rust
      run: rustup toolchain install stable --profile minimal

    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: '3.47.7'
        channel: 'stable'
        cache: true

    - name: Check the core hash is current
      working-directory: .
      run: |
        ./tool/core_hash.sh --write >/dev/null
        git diff --exit-code flutter/rust/src/core_hash.rs

    - name: Build, sign and upload
      env:
        PRIVATE_KEY: ${{ secrets.CARGOKIT_PRIVATE_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        android=()
        if [ "$RUNNER_OS" = Linux ]; then
          android=(--android-sdk-location="$ANDROID_HOME"
                   --android-ndk-version="$(basename "$ANDROID_NDK_LATEST_HOME")"
                   --android-min-sdk-version=21)
        fi
        dart pub get
        dart run build_tool precompile-binaries -v --manifest-dir=../../rust \
          --repository="$GITHUB_REPOSITORY" ${{ matrix.targets }} "${android[@]}"

  web-binding:
    name: Web binding
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Waits for the same approval as the Flutter libraries; both start once prepare is done, so one
    # review approves them together.
    environment: release
    permissions:
      contents: write
    env:
      WASM_BINDGEN_VERSION: 0.2.129
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Rust
      run: |
        rustup toolchain install stable --profile minimal
        rustup target add wasm32-unknown-unknown
        cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked

    - name: Build and test
      run: |
        cargo build --locked --release -p symbolon-wasm --target wasm32-unknown-unknown
        wasm=target/wasm32-unknown-unknown/release/symbolon_wasm.wasm
        wasm-bindgen --target nodejs --out-dir wasm/pkg-node "$wasm"
        node --test wasm/tests/binding.test.mjs
        wasm-bindgen --target web --no-typescript --out-dir dist/symbolon "$wasm"

    - name: Package
      run: |
        name="symbolon-web-${GITHUB_REF_NAME}.tar.gz"
        tar -C dist --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' -cf - symbolon | gzip -n > "$name"
        sha256sum "$name" > "$name.sha256"
        cat "$name.sha256"

    - name: Upload to the draft
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber symbolon-web-*.tar.gz*

  publish:
    name: Publish the release
    needs: [ prepare, flutter-libraries, web-binding ]
    # Also when the libraries were already published and their job was skipped.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.web-binding.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.flutter-libraries.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    # Publishing makes a release immutable, so first check that every file is there.
    - name: Check the drafts and publish them
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        LIBRARIES: ${{ needs.prepare.outputs.libraries }}
        BUILT: ${{ needs.prepare.outputs.build-libraries }}
      run: |
        assets() {
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$1\" and .draft) | .assets[].name"
        }
        if [ "$BUILT" = true ]; then
          libs=$(assets "$LIBRARIES")
          for t in x86_64-unknown-linux-gnu aarch64-linux-android armv7-linux-androideabi \
                  x86_64-linux-android aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios \
                  aarch64-apple-ios-sim x86_64-apple-ios x86_64-pc-windows-msvc; do
            grep -qx "${t}_.*\.sig" <<<"$libs" || { echo "::error::$t has no signed library in $LIBRARIES"; exit 1; }
          done
        fi
        web=$(assets "$GITHUB_REF_NAME")
        for f in "symbolon-web-$GITHUB_REF_NAME.tar.gz" "symbolon-web-$GITHUB_REF_NAME.tar.gz.sha256"; do
          grep -qx "$f" <<<"$web" || { echo "::error::$GITHUB_REF_NAME has no $f"; exit 1; }
        done
        # Libraries first: once the version is public, apps that pin it must find them.
        if [ "$BUILT" = true ]; then
          gh release edit "$LIBRARIES" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
        fi
        gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  check-flutter-libraries:
    name: Check prebuilt Flutter libraries
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: flutter/cargokit/build_tool
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: '3.47.7'
        channel: 'stable'
        cache: true

    # Downloads every published library for this crate hash and checks its signature.
    - name: Verify
      run: |
        [ -f ../../rust/cargokit.yaml ] || exit 0
        dart pub get
        out=$(dart run build_tool verify-binaries --manifest-dir=../../rust)
        echo "$out"
        # It lists every target cargokit knows; only the ones built above have to be there.
        for t in x86_64-unknown-linux-gnu aarch64-linux-android armv7-linux-androideabi \
                 x86_64-linux-android aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios \
                 aarch64-apple-ios-sim x86_64-apple-ios x86_64-pc-windows-msvc; do
          grep -E "Checking $t\.\.\. +OK" <<<"$out" >/dev/null || { echo "::error::$t missing or invalid"; exit 1; }
        done
        ! grep -q "INVALID SIGNATURE" <<<"$out"
