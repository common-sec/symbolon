# New releases are only proposed once they have been public for a week.
# Security updates are not delayed by the cooldown.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(cargo)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"

  # The Flutter binding. flutter_rust_bridge is left alone: the Dart package, the crate and the
  # generated code have to move to a new version together.
  - package-ecosystem: cargo
    directory: /flutter/rust
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(cargo)"
    ignore:
      - dependency-name: flutter_rust_bridge

  - package-ecosystem: pub
    directory: /flutter
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(pub)"
    ignore:
      - dependency-name: flutter_rust_bridge
